[project]
name = "my-jango"
version = "0.1.0"
description = "Django storefront with a FastAPI AI backend"
readme = "README_FASTAPI_SETUP.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "Django==6.0.3",
    "fastapi==0.109.0",
    "httpx==0.25.0",
    "numpy>=2.0.0,<3.0.0",
    "openai==1.14.0",
    "pydantic==2.6.0",
    "python-dotenv==1.0.0",
    "torch==2.2.0",
    "transformers==4.37.0",
    "uvicorn==0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true

[tool.django-stubs]
django_settings_module = "config.settings"
