<!-- Example recommendations template for Django -->
<!-- Save this as: clothstore/templates/clothstore/recommendations.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Product Recommendations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .search-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
        }

        .search-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 200px 100px;
            gap: 15px;
            margin-bottom: 20px;
        }

        input,
        select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="text"] {
            flex: 1;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .recommendations-section {
            margin-top: 40px;
        }

        .recommendations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .recommendation-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        .recommendation-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-header h3 {
            margin-bottom: 5px;
            font-size: 1.2em;
        }

        .card-body {
            padding: 20px;
        }

        .category-badge {
            display: inline-block;
            background: #f0f0f0;
            color: #666;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .reasoning {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
            font-style: italic;
        }

        .similarity-score {
            font-size: 0.9em;
            color: #888;
            margin-top: 10px;
        }

        .model-badge {
            display: inline-block;
            background: #e3f2fd;
            color: #1976d2;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }

        .model-selector {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 15px;
        }

        .model-selector label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 500;
            color: #333;
        }

        .model-selector input[type="radio"] {
            cursor: pointer;
        }

        .info-box {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
        }

        .info-box p {
            color: #666;
            margin-bottom: 8px;
        }

        .info-box p:last-child {
            margin-bottom: 0;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 15px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
            margin-top: 20px;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .input-group {
                grid-template-columns: 1fr;
            }

            .recommendations-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🛍️ Smart Product Recommendations</h1>

        <div class="search-section">
            <h2>Find Perfect Products For You</h2>

            <div class="input-group">
                <input type="text" id="preferenceInput" placeholder="What are you looking for? e.g., 'casual summer outfit'"
                    value="casual summer clothes">
                <select id="categorySelect">
                    <option value="">All Categories</option>
                    <option value="Tops">Tops</option>
                    <option value="Bottoms">Bottoms</option>
                    <option value="Outerwear">Outerwear</option>
                    <option value="Footwear">Footwear</option>
                    <option value="Accessories">Accessories</option>
                </select>
                <select id="countSelect">
                    <option value="3">3 Items</option>
                    <option value="5" selected>5 Items</option>
                    <option value="10">10 Items</option>
                </select>
            </div>

            <div class="model-selector">
                <label>
                    <input type="radio" name="model" value="local" checked> Local ML (Fast, Free)
                </label>
                <label>
                    <input type="radio" name="model" value="openai"> OpenAI (Better Quality)
                </label>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="getRecommendations()">Get Recommendations</button>
                <button class="btn-secondary" onclick="clearRecommendations()">Clear</button>
            </div>

            <div class="info-box">
                <p><strong>💡 Tip:</strong> Describe what you're looking for in natural language!</p>
                <p>Examples: "comfortable summer wear", "formal evening outfit", "casual weekend clothing"</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Finding perfect products for you...</p>
        </div>

        <div class="recommendations-section" id="recommendationsSection" style="display: none;">
            <h2 id="resultTitle">Recommended Products</h2>
            <div id="recommendations" class="recommendations-grid"></div>
        </div>
    </div>

    <script>
        const CSRF_TOKEN = '{{ csrf_token }}';

        async function getRecommendations() {
            const preference = document.getElementById('preferenceInput').value.trim();
            const category = document.getElementById('categorySelect').value;
            const count = parseInt(document.getElementById('countSelect').value);
            const model = document.querySelector('input[name="model"]:checked').value;

            if (!preference) {
                showError('Please describe what you are looking for');
                return;
            }

            showLoading(true);
            clearMessages();

            try {
                const response = await fetch('/ai/api/recommendations/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': CSRF_TOKEN,
                    },
                    body: JSON.stringify({
                        user_preference: preference,
                        category: category,
                        count: count,
                        use_openai: model === 'openai'
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                    return;
                }

                displayRecommendations(data.recommendations, data.model);
                showSuccess(`Found ${data.count} recommendations using ${data.model}`);

            } catch (error) {
                showError(`Error fetching recommendations: ${error.message}`);
            } finally {
                showLoading(false);
            }
        }

        function displayRecommendations(recommendations, model) {
            const container = document.getElementById('recommendations');
            const section = document.getElementById('recommendationsSection');

            container.innerHTML = '';

            if (recommendations.length === 0) {
                container.innerHTML = '<p>No recommendations found. Try refining your search.</p>';
                section.style.display = 'block';
                return;
            }

            recommendations.forEach((rec, index) => {
                const card = document.createElement('div');
                card.className = 'recommendation-card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3>${index + 1}. ${rec.product_name}</h3>
                        <span class="category-badge">${rec.category}</span>
                    </div>
                    <div class="card-body">
                        <p class="reasoning">"${rec.reasoning}"</p>
                        ${rec.similarity_score ? `<p class="similarity-score">Similarity: ${(rec.similarity_score * 100).toFixed(0)}%</p>` : ''}
                        <span class="model-badge">${model}</span>
                    </div>
                `;
                container.appendChild(card);
            });

            section.style.display = 'block';
        }

        function clearRecommendations() {
            document.getElementById('recommendations').innerHTML = '';
            document.getElementById('recommendationsSection').style.display = 'none';
            document.getElementById('preferenceInput').value = '';
            clearMessages();
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = '❌ ' + message;
            el.style.display = 'block';
        }

        function showSuccess(message) {
            const el = document.getElementById('successMessage');
            el.textContent = '✅ ' + message;
            el.style.display = 'block';
        }

        function clearMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        // Load recommendations on page load
        window.addEventListener('load', () => {
            if (document.getElementById('preferenceInput').value) {
                getRecommendations();
            }
        });
    </script>
</body>

</html>
